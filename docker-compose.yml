services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projects-api
    environment:
      APP_NAME: "KanbanCore API"
      APP_ENV: "docker"
      APP_DEBUG: "true"
      APP_VERSION: "0.1.0"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/projects_api"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/projects_api_test"
      JWT_SECRET_KEY: "change-this-secret-key"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: []
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: projects-api-db
    environment:
      POSTGRES_DB: projects_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projects_api"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: